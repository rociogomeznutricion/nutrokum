<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport optimizado para Smart Devices: Evita zooms accidentales al interactuar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrokum - El Expediente Nutricional del dia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700;800&display=swap');

        /* ==========================================
           1. VARIABLES Y ESTILOS BASE (RESPONSIVE)
           ========================================== */
        :root {
            --bg-body: #111827;
            --paper-color: #f7f4ee; 
            --paper-right: #fbf9f5;
            --text-main: #1a202c;
            --text-muted: #4a5568;
            --primary-color: #1a365d;
            --accent-color: #2b6cb0;
            --border-color: #cbd5e0;
            --badge-facil: #276749;
            --badge-intermedio: #d69e2e;
            --badge-dificil: #9b2c2c;
            --touch-target: 44px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation; 
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 10px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER DEL RETO DIARIO */
        .daily-header {
            text-align: center;
            color: #fff;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .daily-header h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        .daily-header p {
            font-size: 14px;
            color: #9ca3af;
            margin: 0;
        }

        /* ==========================================
           2. ESTRUCTURA FLUIDA (MÓVIL / TABLET)
           ========================================== */
        .book-spread-page {
            width: 100%;
            max-width: 1000px;
            background: var(--paper-color);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .page-left, .page-right {
            width: 100%;
            padding: 20px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .page-left {
            border-bottom: 2px dashed var(--border-color);
        }

        .page-right {
            background-color: var(--paper-right);
            gap: 15px;
        }

        /* ==========================================
           3. ELEMENTOS INTERNOS Y TABLAS
           ========================================== */
        .case-number {
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            letter-spacing: 1.5px;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .case-title {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 800;
            color: var(--primary-color);
            margin: 0 0 8px 0;
            line-height: 1.25;
        }

        .badge-difficulty {
            display: inline-block;
            color: #fff;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            align-self: flex-start;
        }

        .badge-facil { background-color: var(--badge-facil); }
        .badge-intermedio { background-color: var(--badge-intermedio); }
        .badge-dificil { background-color: var(--badge-dificil); }

        .context-box {
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-muted);
            background: #eae5de;
            padding: 12px;
            border-left: 4px solid var(--accent-color);
            margin-bottom: 14px;
            border-radius: 0 6px 6px 0;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-color);
            margin: 12px 0 6px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .elements-summary {
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .clues-list {
            padding-left: 20px;
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
        }

        .clues-list li {
            margin-bottom: 8px;
        }

        .matrix-header-title {
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .table-responsive-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
        }

        table.grid-table {
            width: 100%;
            min-width: 320px;
            border-collapse: collapse;
            font-size: 11px;
        }

        table.grid-table th {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 8px 4px;
            font-size: 10.5px;
            font-weight: 700;
            text-align: center;
        }

        table.grid-table td {
            border: 1px solid var(--border-color);
            height: 40px;
            text-align: center;
            font-size: 14px;
        }

        table.grid-table td.row-label {
            text-align: left;
            padding-left: 8px;
            font-weight: 700;
            background-color: #edf2f7;
            font-size: 11px;
            line-height: 1.2;
        }

        tr.category-divider td {
            border-top: 2px solid var(--primary-color) !important;
        }

        .notes-area {
            border: 1px dashed #a0aec0;
            border-radius: 6px;
            min-height: 90px;
            padding: 10px;
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            background-color: #fff;
            width: 100%;
        }

        .notes-area:empty:before {
            content: attr(data-placeholder);
            color: #a0aec0;
        }

        .solution-toggle {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 20px;
        }

        details {
            background: #1f2937;
            color: #fff;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13.5px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            color: #90cdf4;
            min-height: 30px;
            display: flex;
            align-items: center;
        }

        .solution-content {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #374151;
            line-height: 1.5;
        }

        .solution-pill {
            background: #2d3748;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-style: italic;
            color: #e2e8f0;
            font-size: 12.5px;
        }

        .loading-msg {
            color: white;
            text-align: center;
            padding: 50px 20px;
            font-size: 18px;
        }

        /* ==========================================
           4. ADAPTATIVIDAD PARA TABLETS Y ESCRITORIO
           ========================================== */
        @media (min-width: 768px) {
            body {
                padding: 20px;
            }

            .book-spread-page {
                flex-direction: row;
                min-height: 520px;
            }

            .page-left, .page-right {
                width: 50%;
                padding: 25px;
            }

            .page-left {
                border-bottom: none;
                border-right: 1px dashed var(--border-color);
            }
        }
    </style>
</head>
<body>

    <div class="daily-header">
        <h1>🔍 Nutrokum DIARIO</h1>
        <p>Un reto de deducción lógica nutricional nuevo cada día</p>
    </div>

    <!-- VISTA EN PANTALLA -->
    <div class="book-spread-page" id="vistaPantalla">
        <div class="loading-msg">⏳ Cargando el reto de hoy...</div>
    </div>

    <div class="solution-toggle" id="contenedorSolucion" style="display: none;">
        <details>
            <summary>Ver Solución Oficial y Píldora Científica</summary>
            <div class="solution-content">
                <p><strong>Resolución Lógica:</strong> <span id="solResolution"></span></p>
                <div class="solution-pill" id="solPill"></div>
            </div>
        </details>
    </div>

    <script>
        function renderCasoHTML(c) {
            return `
                <div class="page-left">
                    <div class="case-number">${c.num}</div>
                    <h1 class="case-title">${c.titulo}</h1>
                    <span class="badge-difficulty ${c.dificultadClass}">NIVEL: ${c.dificultad}</span>
                    <div class="context-box">${c.contexto}</div>
                    <div class="section-title">📌 Elementos a Deducir</div>
                    <div class="elements-summary">
                        <div><strong>${c.catA.titulo}:</strong> ${c.catA.items.join(', ')}</div>
                        <div><strong>${c.catB.titulo}:</strong> ${c.catB.items.join(', ')}</div>
                        <div><strong>${c.catC.titulo}:</strong> ${c.catC.items.join(', ')}</div>
                    </div>
                    <div class="section-title">🔍 Pistas Deductivas</div>
                    <ol class="clues-list">
                        ${c.pistas.map(p => `<li>${p}</li>`).join('')}
                    </ol>
                </div>
                <div class="page-right">
                    <div>
                        <div class="matrix-header-title">Matriz de Deducción Lógica</div>
                        <div class="table-responsive-wrapper">
                            <table class="grid-table">
                                <thead>
                                    <tr>
                                        <th style="text-align:left; padding-left:8px;">VARIABLES</th>
                                        <th width="26%">${c.catA.items[0]}</th>
                                        <th width="26%">${c.catA.items[1]}</th>
                                        <th width="26%">${c.catA.items[2]}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${c.catB.items.map(item => `
                                        <tr>
                                            <td class="row-label">${item}</td>
                                            <td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td>
                                        </tr>
                                    `).join('')}
                                    ${c.catC.items.map((item, idx) => `
                                        <tr ${idx === 0 ? 'class="category-divider"' : ''}>
                                            <td class="row-label">${item}</td>
                                            <td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div>
                        <div class="section-title" style="margin-top:0;">📝 Notas de Investigación</div>
                        <div class="notes-area" contenteditable="true" data-placeholder="Toca aquí para escribir tus notas o hipótesis..."></div>
                    </div>
                </div>
            `;
        }

        // CARGA DINÁMICA DEL CASO DEL DÍA
        function cargarCasoDelDia() {
            fetch('caso_actual.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('No se ha encontrado el archivo caso_actual.json');
                    }
                    return response.json();
                })
                .then(c => {
                    document.getElementById('vistaPantalla').innerHTML = renderCasoHTML(c);
                    document.getElementById('solResolution').textContent = c.solucion;
                    document.getElementById('solPill').innerHTML = `<strong>💡 Píldora Científica:</strong> ${c.pildora}`;
                    document.getElementById('contenedorSolucion').style.display = 'block';
                })
                .catch(error => {
                    console.error('Error cargando el caso:', error);
                    document.getElementById('vistaPantalla').innerHTML = `
                        <div class="loading-msg">
                            <h3>⚠️ No hay un reto disponible hoy</h3>
                            <p>Vuelve más tarde o comprueba que se haya publicado el reto del día.</p>
                        </div>
                    `;
                });
        }

        window.onload = cargarCasoDelDia;
    </script>
</body>
</html>
