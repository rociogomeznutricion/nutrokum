name: Automatización Diaria

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC (ajusta la hora si lo deseas)
    - cron: '0 8 * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras desde GitHub

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script principal
        env:
          # Descomenta esta línea si usas algún Secret configurado en GitHub:
          # API_KEY: ${{ secrets.MI_API_KEY }}
        run: python tu_script.py
