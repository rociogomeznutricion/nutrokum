<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casos de Nutrición - Nutriku</title>
    <style>
        :root {
            --primary: #2e7d32;
            --bg: #f4f6f5;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 1.1rem;
            display: block;
        }
        .badge {
            font-size: 0.7rem;
            background: #e0e0e0;
            padding: 3px 8px;
            border-radius: 4px;
            color: #555;
            margin-top: 8px;
            display: inline-block;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            color: #666;
            font-size: 1.1rem;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Herramientas de Nutrición</h1>
    <div id="file-list" class="grid">
        <div class="loading">Cargando archivos...</div>
    </div>

    <script>
        // CONFIGURACIÓN: Reemplaza estos datos con los tuyos de GitHub
        const username = 'rociogomeznutricion';
        const repo = 'NUTROKUM';
        const path = 'casos'; // Nombre de la carpeta en tu repositorio

        const url = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('No se pudo conectar con la API de GitHub');
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('file-list');
                container.innerHTML = '';

                if (!Array.isArray(data)) {
                    container.innerHTML = '<div class="loading">La ruta especificada no es válida o está vacía.</div>';
                    return;
                }

                // Filtrar archivos .html y .pdf, excluyendo el propio index.html
                const files = data.filter(file => 
                    (file.name.endsWith('.html') || file.name.endsWith('.pdf')) && 
                    file.name !== 'index.html'
                );

                if (files.length === 0) {
                    container.innerHTML = '<div class="loading">No hay herramientas o PDFs disponibles todavía.</div>';
                    return;
                }

                files.forEach(file => {
                    // Obtener la extensión para la etiqueta
                    const ext = file.name.split('.').pop().toUpperCase();
                    
                    // Limpiar el nombre del archivo para que se vea estético (quita guiones y extensión)
                    let cleanName = file.name
                        .replace(/\.(html|pdf)$/, '')
                        .replace(/[-_]/g, ' ');
                    cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);

                    // Crear la tarjeta visual
                    const card = document.createElement('div');
                    card.className = 'card';

                    card.innerHTML = `
                        <a href="${file.name}" target="_blank">${cleanName}</a>
                        <span class="badge">${ext}</span>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('file-list').innerHTML = '<div class="loading">Error al cargar los archivos desde GitHub. Revisa la consola o la configuración.</div>';
            });
    </script>

</body>
</html>
