<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUTRIKU</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        nav {
            background-color: #ffffff;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 20px;
        }
        li a {
            text-decoration: none;
            color: #27ae60;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s;
        }
        li a:hover {
            background-color: #27ae60;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav>
        <h1>NUTRIKU</h1>
        <ul>
            <li><a href="https://www.nutriku.com/casos">CASOS</a></li>
            <li><a href="https://www.nutriku.com/herramientas">HERRAMIENTAS</a></li>
            <li><a href="https://www.nutriku.com/recursos_videos">RECURSOS</a></li>
        </ul>
    </nav>

</body>
</html>
