<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUTRIKU</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        nav {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 28px;
            letter-spacing: 2px;
        }

        ul {
            list-style-type: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        li a {
            display: block;
            text-decoration: none;
            color: #27ae60;
            font-weight: bold;
            font-size: 16px;
            padding: 14px;
            border: 2px solid #27ae60;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
        }

        li a:hover, li a:active {
            background-color: #27ae60;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav>
        <h1>NUTRIKU</h1>
        <ul>
            <li><a href="https://www.nutriku.com/casos">CASOS</a></li>
            <li><a href="https://www.nutriku.com/herramientas">HERRAMIENTAS</a></li>
            <li><a href="https://www.nutriku.com/recursos_videos">RECURSOS</a></li>
        </ul>
    </nav>

</body>
</html>
