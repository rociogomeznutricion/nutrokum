<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUTRIKU — Calculadora de Equivalencias e Intercambios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#0B191F;
    --cream-soft:#11252C;
    --paper:#071216;
    --ink:#E2EEF3;
    --green:#00E5FF;
    --green-deep:#061318;
    --green-bright:#5CE5A0;
    --mint:#7FE0B5;
    --terminal:#061318;
    --terminal-line:#0E222A;
    --code:#5CE5A0;
    --amber:#FFB74D;
    --line: rgba(0,229,255,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .tech-container{
    width: 100%;
    max-width: 640px;
    background: var(--cream-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 25px rgba(0,229,255,0.1);
    overflow: hidden;
  }
  .tech-bar{
    display:flex;align-items:center;gap:8px;
    padding:12px 16px;background:var(--terminal-line);
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .tech-dot{width:10px;height:10px;border-radius:50%;}
  .tech-dot.r{background:#E5675C;} .tech-dot.y{background:#E5B85C;} .tech-dot.g{background:#5CE5A0;}
  .tech-title{margin-left:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#9FB39A;}
  
  .tech-body{padding: 32px 28px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--green);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .eyebrow::before{content:"//";color:var(--amber);}
  h2{
    font-family:'Playfair Display',serif;
    font-size: 28px;
    color: #FFFFFF;
    margin: 0 0 8px 0;
  }
  p.desc{
    font-size: 14px;
    color: var(--ink);
    opacity: 0.85;
    margin-bottom: 24px;
  }
  
  .tool-workspace{
    background: var(--terminal);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px;
    font-family:'JetBrains Mono',monospace;
    color: var(--ink);
  }

  .form-group{
    margin-bottom: 18px;
  }
  label{
    display: block;
    font-size: 12.5px;
    color: var(--mint);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  select, input{
    width: 100%;
    background: var(--cream-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px;
    color: #FFFFFF;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
  }
  select:focus, input:focus{
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 10px rgba(0,229,255,0.2);
  }

  .btn-tech{
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    padding: 12px 20px;
    border-radius: 4px;
    background: var(--green);
    color: #061318;
    font-weight: 600;
    border: none;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
    transition: transform .18s ease, box-shadow .18s ease;
    box-shadow: 0 4px 15px rgba(0,229,255,0.3);
  }
  .btn-tech:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,229,255,0.45);
  }

  .results-box{
    margin-top: 22px;
    border-top: 1px dashed var(--line);
    padding-top: 18px;
    display: none;
  }
  .results-box h3{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--code);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .equivalence-item{
    background: rgba(0,229,255,0.05);
    border-left: 2px solid var(--green);
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 13.5px;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="tech-container">
  <div class="tech-bar">
    <span class="tech-dot r"></span><span class="tech-dot y"></span><span class="tech-dot g"></span>
    <span class="tech-title">nutriku@module — ~/equivalencias_flexibles.js</span>
  </div>
  <div class="tech-body">
    <div class="eyebrow">Método ARRANCA • Autonomía en Cocina</div>
    <h2>Calculadora de Equivalencias</h2>
    <p class="desc">Introduce lo que tienes en la despensa y calcula al instante tus opciones de intercambio flexible sin depender de un menú cerrado.</p>
    
    <div class="tool-workspace">
      <div class="form-group">
        <label for="foodGroup">1. Selecciona Grupo de Alimentos</label>
        <select id="foodGroup" onchange="actualizarOpciones()">
          <option value="hidratos">Hidratos de Carbono (Cocinados)</option>
          <option value="proteinas">Proteínas (Magras / Base)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="baseFood">2. Ingrediente Base Disponible</label>
        <select id="baseFood">
          <option value="patata">Patata cocida / asada</option>
          <option value="arroz">Arroz blanco / integral cocido</option>
          <option value="pasta">Pasta cocida</option>
          <option value="ñoquis">Ñoquis cocidos</option>
        </select>
      </div>

      <div class="form-group">
        <label for="amount">3. Cantidad en Gramos (g)</label>
        <input type="number" id="amount" value="150" min="10" max="500">
      </div>

      <button class="btn-tech" onclick="calcularIntercambios()">Calcular Equivalencias ➔</button>

      <div class="results-box" id="resultsBox">
        <h3>[ok] Equivalencias calculadas con éxito:</h3>
        <div id="resultsContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function actualizarOpciones() {
    const grupo = document.getElementById('foodGroup').value;
    const baseFood = document.getElementById('baseFood');
    baseFood.innerHTML = '';
    
    if(grupo === 'hidratos') {
      baseFood.innerHTML = `
        <option value="patata">Patata cocida / asada</option>
        <option value="arroz">Arroz cocido</option>
        <option value="pasta">Pasta cocida</option>
        <option value="ñoquis">Ñoquis cocidos</option>
      `;
    } else {
      baseFood.innerHTML = `
        <option value="pollo">Pechuga de pollo / pavo</option>
        <option value="atun">Atún al natural (escurrido)</option>
        <option value="merluza">Pescado blanco (merluza/bacalao)</option>
        <option value="tofu">Tofu firme</option>
      `;
    }
  }

  function calcularIntercambios() {
    const cantidad = parseFloat(document.getElementById('amount').value) || 0;
    const grupo = document.getElementById('foodGroup').value;
    const base = document.getElementById('baseFood').value;
    const box = document.getElementById('resultsBox');
    const content = document.getElementById('resultsContent');
    
    if(cantidad <= 0) return;
    
    box.style.display = 'block';
    content.innerHTML = '';
    
    let equivalencias = [];

    if(grupo === 'hidratos') {
      // Coeficientes aproximados orientativos basados en densidad de hidrato cocido
      let baseFactor = 1;
      if(base === 'arroz' || base === 'pasta') baseFactor = 1.2;
      if(base === 'ñoquis') baseFactor = 1.1;
      
      const gramosBaseNormalizados = cantidad / baseFactor;

      equivalencias = [
        { nombre: 'Patata cocida', gramos: Math.round(gramosBaseNormalizados * 1.0) },
        { nombre: 'Arroz cocido', gramos: Math.round(gramosBaseNormalizados * 0.85) },
        { nombre: 'Pasta cocida', gramos: Math.round(gramosBaseNormalizados * 0.85) },
        { nombre: 'Ñoquis cocidos', gramos: Math.round(gramosBaseNormalizados * 0.9) },
        { nombre: 'Boniato asado', gramos: Math.round(gramosBaseNormalizados * 0.95) }
      ];
    } else {
      let baseFactor = 1;
      if(base === 'atun') baseFactor = 0.8;
      if(base === 'tofu') baseFactor = 1.3;

      const gramosBaseNormalizados = cantidad / baseFactor;

      equivalencias = [
        { nombre: 'Pollo / Pavo (pesado en crudo/cuajado)', gramos: Math.round(gramosBaseNormalizados * 1.0) },
        { nombre: 'Atún al natural', gramos: Math.round(gramosBaseNormalizados * 1.2) },
        { nombre: 'Pescado blanco', gramos: Math.round(gramosBaseNormalizados * 1.15) },
        { nombre: 'Tofu firme', gramos: Math.round(gramosBaseNormalizados * 1.3) }
      ];
    }

    equivalencias.forEach(eq => {
      const div = document.createElement('div');
      div.className = 'equivalence-item';
      div.innerHTML = `<span>${eq.nombre}</span> <strong style="color:var(--green);">${eq.gramos} g</strong>`;
      content.appendChild(div);
    });
  }
</script>

</body>
</html>
