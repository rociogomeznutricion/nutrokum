<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUTRIKU • Generador de Lista de la Compra Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-slate: #0F172A;
      --card-slate: #1E293B;
      --card-border: #334155;
      --accent-cyan: #38BDF8;
      --accent-emerald: #34D399;
      --accent-pink: #F472B6;
      --accent-amber: #FBBF24;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-slate);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background-color: var(--card-slate);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .badge {
      display: inline-block;
      background-color: rgba(52, 211, 153, 0.1);
      color: var(--accent-emerald);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    select, input[type="text"] {
      width: 100%;
      background-color: var(--bg-slate);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-emerald);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .checkbox-card {
      background-color: var(--bg-slate);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s;
    }

    .checkbox-card:hover {
      border-color: var(--accent-cyan);
    }

    .checkbox-card input {
      accent-color: var(--accent-emerald);
      width: 16px;
      height: 16px;
    }

    .btn-exec {
      width: 100%;
      background: linear-gradient(135deg, #34D399 0%, #38BDF8 100%);
      color: #0F172A;
      font-weight: 800;
      font-size: 1rem;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-exec:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    /* Resultados */
    #resultsSection {
      display: none;
      flex-direction: column;
      gap: 16px;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    #resultsSection::-webkit-scrollbar {
      width: 6px;
    }
    #resultsSection::-webkit-scrollbar-thumb {
      background-color: var(--card-border);
      border-radius: 4px;
    }

    .category-box {
      background-color: var(--bg-slate);
      border-left: 4px solid var(--accent-emerald);
      border-radius: 12px;
      padding: 16px;
    }

    .category-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-list {
      list-style: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-list li {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-list input[type="checkbox"] {
      accent-color: var(--accent-emerald);
      width: 15px;
      height: 15px;
    }

    .logic-box {
      background-color: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.85rem;
      color: var(--accent-emerald);
      line-height: 1.4;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background-color: var(--card-border);
      color: var(--text-main);
    }

    .footer-brand {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="formSection">
      <span class="badge">🛒 Compilador de Despensa</span>
      <h1>Lista de la Compra Inteligente</h1>
      <p class="subtitle">Configura tus parámetros semanales para evitar compras impulsivas y asegurar variedad real.</p>

      <div class="form-group">
        <label for="pacingSelect">⚡ ¿Cómo se presenta tu semana?</label>
        <select id="pacingSelect">
          <option value="normal">Semana estándar (Ritmo normal / Cocina habitual)</option>
          <option value="rapida">Semana a full (Necesito cero complicaciones y rapidez)</option>
          <option value="batch">Semana de planificación (Voy a cocinar en bloque)</option>
        </select>
      </div>

      <div class="form-group">
        <label>🥦 Selecciona los comodines que quieres incluir:</label>
        <div class="checkbox-grid">
          <label class="checkbox-card"><input type="checkbox" id="congelados" checked> Congelados SOS</label>
          <label class="checkbox-card"><input type="checkbox" id="conservas" checked> Conservas de calidad</label>
          <label class="checkbox-card"><input type="checkbox" id="snacks" checked> Extras / Snacks reales</label>
          <label class="checkbox-card"><input type="checkbox" id="condimentos" checked> Especias y salsas base</label>
        </div>
      </div>

      <button class="btn-exec" onclick="generarLista()">Compilar Lista de la Compra ➔</button>
    </div>

    <div id="resultsSection">
      <span class="badge">✨ Despensa Optimizada</span>
      <h1 style="font-size: 1.3rem;">Tu Cesta del Método ARRANCA</h1>
      
      <div id="listaContenedor">
        </div>

      <div class="logic-box" id="logicContainer">
        </div>

      <button class="btn-back" onclick="resetForm()">🔄 Modificar parámetros</button>
    </div>

    <div class="footer-brand">
      NUTRIKU • Método ARRANCA
    </div>
  </div>

  <script>
    function generarLista() {
      const pacing = document.getElementById('pacingSelect').value;
      const incCongelados = document.getElementById('congelados').checked;
      const incConservas = document.getElementById('conservas').checked;
      const incSnacks = document.getElementById('snacks').checked;
      const incCondimentos = document.getElementById('condimentos').checked;

      let html = '';

      // 1. Vegetales y Frutas
      html += `
        <div class="category-box">
          <div class="category-title">🌱 Vegetales y Frutas (La base del plato)</div>
          <ul class="item-list">
            <li><input type="checkbox"> ${pacing === 'rapida' ? 'Bolsas de hojas verdes prelavadas (espinacas/brotes)' : 'Espinacas frescas o lechuga variada'}</li>
            <li><input type="checkbox"> Verduras para asar/saltear (Calabacín, pimientos, zanahorias)</li>
            <li><input type="checkbox"> ${pacing === 'rapida' ? 'Verduras congeladas para salteados exprés (brócoli/surtido)' : 'Brócoli o judías verdes frescas'}</li>
            <li><input type="checkbox"> Tomates y aguacates (para consumo diario)</li>
            <li><input type="checkbox"> Fruta de temporada (Plátanos, manzanas o bayas)</li>
          </ul>
        </div>
      `;

      // 2. Proteínas Principales
      html += `
        <div class="category-box" style="border-left-color: var(--accent-cyan);">
          <div class="category-title" style="color: var(--accent-cyan);">🥩 Fuentes de Proteína (Estructura central)</div>
          <ul class="item-list">
            <li><input type="checkbox"> Huevos camperos (imprescindible fondo de nevera)</li>
            <li><input type="checkbox"> Pechuga de pollo, pavo o lomo de cerdo magro</li>
            <li><input type="checkbox"> Pescado blanco o azul fresco (merluza, salmón o dorada)</li>
            <li><input type="checkbox"> Tofu firme o Tempeh (opción vegetal versátil)</li>
          </ul>
        </div>
      `;

      // 3. Hidratos y Fuentes Energéticas
      html += `
        <div class="category-box" style="border-left-color: var(--accent-amber);">
          <div class="category-title" style="color: var(--accent-amber);">🥔 Hidratos de Calidad y Tubérculos</div>
          <ul class="item-list">
            <li><input type="checkbox"> Patatas o boniatos (para asar o microondas rápido)</li>
            <li><input type="checkbox"> Arroz integral, quinoa o pasta de legumbre</li>
            <li><input type="checkbox"> Pan 100% integral de masa madre o centeno</li>
          </ul>
        </div>
      `;

      // 4. Condicionales / Opcionales elegidos por el usuario
      if (incCongelados) {
        html += `
          <div class="category-box" style="border-left-color: var(--accent-pink);">
            <div class="category-title" style="color: var(--accent-pink);">🧊 Comodines Congelados (Red de seguridad)</div>
            <ul class="item-list">
              <li><input type="checkbox"> Gambas peladas congeladas</li>
              <li><input type="checkbox"> Frutos rojos congelados (para yogures o boles rápidos)</li>
            </ul>
          </div>
        `;
      }

      if (incConservas) {
        html += `
          <div class="category-box" style="border-left-color: var(--accent-pink);">
            <div class="category-title" style="color: var(--accent-pink);">🥫 Conservas y Bote (Soluciones a 2 minutos)</div>
            <ul class="item-list">
              <li><input type="checkbox"> Botes de legumbres cocidas (lentejas, garbanzos o alubias)</li>
              <li><input type="checkbox"> Latas de atún al natural o sardinas en aceite de oliva</li>
              <li><input type="checkbox"> Tomate triturado natural (sin azúcares añadidos)</li>
            </ul>
          </div>
        `;
      }

      if (incSnacks) {
        html += `
          <div class="category-box" style="border-left-color: var(--accent-pink);">
            <div class="category-title" style="color: var(--accent-pink);">🥜 Grasas Saludables y Extras</div>
            <ul class="item-list">
              <li><input type="checkbox"> Frutos secos naturales o tostados (nueces, almendras)</li>
              <li><input type="checkbox"> Chocolate negro (mínimo 85%)</li>
              <li><input type="checkbox"> Aceite de oliva virgen extra y AOVE para cocinar</li>
            </ul>
          </div>
        `;
      }

      // Consejo final
      document.getElementById('logicContainer').innerText = "💡 Consejo Método ARRANCA: Una compra inteligente elimina la necesidad de tomar decisiones bajo presión el martes por la noche. Los botes de legumbres y los congelados no son 'trampas', son tu red de seguridad contra los ultraprocesados.";

      document.getElementById('listaContenedor').innerHTML = html;
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('resultsSection').style.display = 'flex';
    }

    function resetForm() {
      document.getElementById('resultsSection').style.display = 'none';
      document.getElementById('formSection').style.display = 'block';
    }
  </script>
</body>
</html>
